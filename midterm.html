
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>校園講座報名</title>
</head>
<body>

<header>
    <h1>2026 校園講座</h1>
</header>

<nav>
    <a href="https://share.google/s6Bs6R4cZZJjEphL2" target="_blank">講座資訊</a>
    <a href="https://init.engineer/cards/show/12015" target="_blank">線上報名</a>
</nav>

<main>
    <section id="info">
        <h2>講座介紹</h2>
        <p>
            本次校園講座將介紹人工智慧、資訊安全與網頁設計等熱門主題，
            邀請專業講師分享最新科技趨勢與實務經驗，
            歡迎同學及校外人士踴躍報名參加。（◕﹃◕）
        </p>

        <img src="lecture.jpg" alt="2026 校園講座活動圖片">

        <h2>講座場次資訊</h2>
        <table border="1">
            <tr>
                <th>日期</th>
                <th>時間</th>
                <th>地點</th>
            </tr>
            <tr>
                <td>2026/12/01</td>
                <td>10:00－12:00</td>
                <td>第一會議室</td>
            </tr>
            <tr>
                <td>2026/12/01</td>
                <td>16:00－18:00</td>
                <td>第二會議室</td>
            </tr>
        </table>
    </section>

    <section id="register">
        <h2>講座報名表</h2>

        <form>
            <label for="name">姓名：</label>
            <input type="text" id="name" name="name">
            <br><br>

            <label for="email">E-mail：</label>
            <input type="email" id="email" name="email">
            <br><br>

            <p>身分：</p>
            <input type="radio" name="identity" value="student">學生
            <input type="radio" name="identity" value="teacher">教師
            <input type="radio" name="identity" value="guest">校外人士
            <br><br>

            <p>有興趣主題：</p>
            <input type="checkbox" name="topic" value="AI">AI
            <input type="checkbox" name="topic" value="security">資安
            <input type="checkbox" name="topic" value="web">網頁設計
            <br><br>

            <label for="date">參加日期：</label>
            <input type="date" id="date" name="date">
            <br><br>

            <label for="session">場次：</label>
            <select id="session" name="session">
                <option value="morning">上午場</option>
                <option value="afternoon">下午場</option>
            </select>
            <br><br>

            <label for="note">備註：</label>
            <br>
            <textarea id="note" name="note" rows="4" cols="40"></textarea>
            <br><br>

            <input type="submit" value="提交">
            <input type="reset" value="重設">
        </form>
    </section>
</main>

<footer>
    <p>2026 校園講座報名頁</p>
</footer>

<script src="/lib/enable.js" type="text/javascript"></script></body>
</html>
